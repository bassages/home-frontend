<form class="date-navigator-form" [formGroup]="form" autocomplete="off" novalidate>

  <div class="input-group">

    <button (click)="navigate(-1)"
      class="btn btn-outline-secondary"
      [ngClass]="{'responsive-size': responsiveSize}"
      type="button"><fa-icon [icon]="faChevronLeft"></fa-icon></button>

      <!--suppress HtmlFormInputWithoutLabel -->
      @if (mode === 'day') {
        <input matInput type="text" class="form-control text-center text-capitalize date-picker-input" name="dayPicker"
          [formControl]="selectedDay"
          [max]="maxDate"
          [matDatepicker]="dayPicker"
          [ngClass]="{
                 'is-invalid': selectedDay.invalid,
                 'responsive-size': responsiveSize
          }"
          required
          readonly
          (click)="openDayPicker($event)"
          (dateChange)="datePickerChanged(selectedDay.value, 'day')" />
        <mat-datepicker #dayPicker></mat-datepicker>
      }

      <!--suppress HtmlFormInputWithoutLabel -->
      @if (mode === 'month') {
        <input matInput type="text" class="form-control text-center text-capitalize date-picker-input" name="monthPicker"
          [formControl]="selectedMonth"
          [max]="maxDate"
          [matDatepicker]="monthPicker"
          [ngClass]="{
                 'is-invalid': selectedMonth.invalid,
                 'responsive-size': responsiveSize
          }"
          required
          readonly
          (click)="openMonthPicker($event)"
          (dateChange)="datePickerChanged(selectedMonth.value, 'month')" />
        <mat-datepicker #monthPicker startView="multi-year" (monthSelected)="monthSelected($event, monthPicker)"></mat-datepicker>
      }

      <!--suppress HtmlFormInputWithoutLabel -->
      @if (mode === 'year') {
        <input matInput type="text" class="form-control text-center date-picker-input" name="yearPicker"
          [formControl]="selectedYear"
          [max]="maxDate"
          [matDatepicker]="yearPicker"
          [ngClass]="{
                 'is-invalid': selectedYear.invalid,
                 'responsive-size': responsiveSize
          }"
          required
          readonly
          (click)="openYearPicker($event)"
          (dateChange)="datePickerChanged(selectedYear.value, 'year')" />
        <mat-datepicker #yearPicker startView="multi-year" (yearSelected)="yearSelected($event, yearPicker)"></mat-datepicker>
      }

      <button type="button"
        class="btn btn-outline-secondary responsive-size"
        [ngClass]="{'responsive-size': responsiveSize}"
        (click)="navigate(+1)" [disabled]="isUpNavigationDisabled()"><fa-icon [icon]="faChevronRight"></fa-icon></button>

      </div>
    </form>
