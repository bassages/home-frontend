<div class="card">
  <div class="card-header h3 clickable" (click)="navigateToVerbruikDetails()">
    <fa-icon [icon]="faFireFlameCurved"></fa-icon> Gas
  </div>
  <div class="card-body">
    <div class="ledbar float-start">
      @for (i of [9,8,7,6,5,4,3,2,1,0]; track i) {
        <div class="led" [ngClass]="gasLeds[i]?.state === LedState.ON ? 'gas-led-' + i : 'led-off'"></div>
      }
    </div>

    <p class="h3">Vandaag</p>
    @if (verbruikVandaag) {
      <div class="h3">{{verbruikVandaag.gasVerbruik | number: '1.3-3'}} m&#179;</div>
    }
    @if (!verbruikVandaag) {
      <div class="h3">- m&#179;</div>
    }

    <hr />

    <p class="h3">Meterstand</p>

    @if (meterstand) {
      <p class="h6">
        <span ngbTooltip="Dal- en normaaltarief">
          <fa-icon [icon]="faMoon"></fa-icon> <fa-icon [icon]="faSun"></fa-icon><span class="ms-1">{{meterstand.gas | number: '1.3-3'}}</span>
        </span>
      </p>
    }
    @if (!meterstand) {
      <p class="h6">
        -
      </p>
    }
  </div>
</div>
