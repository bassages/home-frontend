on:
  # Trigger npm build and Sonar analysis when pushing in main or pull requests, and when creating
  # a pull request.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

name: Build home-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Echo (debug) action details
        uses: hmarr/debug-action@v3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run npm install and npm run build
        run: |
          npm i
          npm run ci:build

      # Repository Actions secrets are not available to fork PRs. Dependabot uses
      # separate secrets and should not be allowed to block dependency-update PRs
      # with an unauthorized SonarCloud analysis.
      - name: Run SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' && (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]')) }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
